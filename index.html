<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec AI - Especialista</title>
    <style>
        /* CSS Integrado */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #202024;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .chat-header {
            background-color: #04d361;
            color: #0a0a0c;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #484a54;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .ai-message {
            background-color: #29292e;
            border: 1px solid #484a54;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            white-space: pre-line;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #121214;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #29292e;
            border-radius: 4px;
            background-color: #202024;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid #04d361;
        }

        button {
            background-color: #04d361;
            color: #0a0a0c;
            border: none;
            padding: 0 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #02a349;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            🛡️ CyberSec AI - Especialista em Segurança
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">Olá! Sou sua IA especialista em Segurança da Informação. Como posso te ajudar a proteger seus sistemas hoje?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite sua dúvida sobre segurança..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // JavaScript Integrado
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // 1. Adiciona a mensagem do usuário na tela
            appendMessage(messageText, 'user-message');
            userInput.value = '';

            // 2. Adiciona um balão de carregamento para a IA
            const loadingId = appendMessage('Pensando...', 'ai-message');

            try {
                // 3. Faz a requisição POST para o backend Python (via JSON)
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                // Remove o balão de carregamento
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    // 4. Exibe a resposta da IA na tela
                    appendMessage(data.response, 'ai-message');
                } else {
                    appendMessage('Erro: ' + (data.error || 'Não foi possível obter resposta.'), 'ai-message');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Erro de conexão com o servidor.', 'ai-message');
                console.error(error);
            }
        }

        function appendMessage(text, className) {
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.id = id;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            
            // Scroll automático para a última mensagem
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
